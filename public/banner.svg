<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061316"/>
      <stop offset="50%" stop-color="#0B2028"/>
      <stop offset="100%" stop-color="#102831"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#00D5D5" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00D5D5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00D5D5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#F5F7F7" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42E4D0"/>
      <stop offset="100%" stop-color="#00D5D5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00D5D5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Contest Labs Pill Badge -->
  <g transform="translate(600, 48)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0B2028" stroke="#00D5D5" stroke-width="1.2"/>
    <circle cx="-116" cy="0" r="4" fill="#32C48D"/>
    <text x="-104" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="11.5" letter-spacing="1.5" fill="#F5F7F7">
      HOUSEBETS CONTEST LABS
    </text>
  </g>

  <!-- Brand Mark (House Icon) -->
  <g transform="translate(600, 118)" filter="url(#shadow)">
    <rect x="-32" y="-32" width="64" height="64" rx="15" fill="#0B2028" stroke="#24434C" stroke-width="1.5"/>
    <path d="M0 -16 L18 0 V14 H-18 V0 Z" fill="url(#accent)"/>
    <rect x="-5" y="3" width="10" height="11" rx="1" fill="#0B2028"/>
  </g>

  <!-- Main Wordmark -->
  <text x="600" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="42" letter-spacing="4" fill="#FFFFFF">
    HOUSEBETS SPORTSBOOK
  </text>
  <text x="600" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="6" fill="#42E4D0">
    5-PAGE CLICKABLE PROTOTYPE • SINGLES ONLY
  </text>

  <!-- Subtitle -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="400" font-size="14.5" fill="#9CB0B4">
    Official entry for the $15,000 Housebets Sportsbook Design Challenge
  </text>

  <!-- Bottom Badges / Metrics Line -->
  <g transform="translate(600, 318)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <text text-anchor="middle" fill="#557178">
      <tspan fill="#32C48D">● LIVE PROTOTYPE READY</tspan>
      <tspan fill="#24434C"> │ </tspan>
      <tspan fill="#C8D5D7">5 SCREENS</tspan>
      <tspan fill="#24434C"> │ </tspan>
      <tspan fill="#C8D5D7">SINGLES ENGINE</tspan>
      <tspan fill="#24434C"> │ </tspan>
      <tspan fill="#C8D5D7">SPLIT-FLAP SCORES</tspan>
      <tspan fill="#24434C"> │ </tspan>
      <tspan fill="#00D5D5">USDT CASHOUT</tspan>
    </text>
  </g>
</svg>
